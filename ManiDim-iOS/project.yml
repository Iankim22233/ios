name: ManiDim
options:
  bundleIdPrefix: com.manidim
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  ManiDim:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ManiDim
        UILaunchScreen: {UIColorName: ""}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarHidden: true
        LSApplicationCategoryType: public.app-category.music-games
        UIBackgroundModes: []
        CFBundleDocumentTypes:
          - CFBundleTypeName: ManiDim Song Package
            LSHandlerRank: Owner
            LSItemContentTypes: [com.manidim.madim]
          - CFBundleTypeName: osu!mania Beatmap Set
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.manidim.osz]
          - CFBundleTypeName: osu!mania Beatmap
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.manidim.osu]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.manidim.madim
            UTTypeDescription: ManiDim Song Package
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [madim]
          - UTTypeIdentifier: com.manidim.osz
            UTTypeDescription: osu! Beatmap Set
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [osz]
          - UTTypeIdentifier: com.manidim.osu
            UTTypeDescription: osu! Beatmap
            UTTypeConformsTo: [public.data, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [osu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manidim.game
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
